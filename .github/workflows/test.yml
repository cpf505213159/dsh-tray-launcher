name: test

# 托盘由 Windows PowerShell 5.1 启动：无 BOM 的 UTF-8 .ps1 会被按 ANSI(GBK) 解码，
# 中文乱码 + 语法解析失败 → 托盘静默起不来。v1.5.0 曾因此发布过坏包，故用 CI 钉住编码。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PowerShell scripts must carry a UTF-8 BOM
        run: npm test
      - name: node --check (bin wrappers + plugin)
        run: |
          node --check bin/dsh-tray.js
          node --check bin/dsh-tray-install.js
          node --check src/plugin.js

  # BOM 只保证编码正确，语法错误仍会让托盘静默起不来。用 Windows 自带的
  # PowerShell 解析器做纯语法检查（不执行），把运行期才暴露的崩溃挡在合并前。
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts for syntax errors (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @('tray.ps1', 'install.ps1', 'uninstall.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              Write-Host "::error file=$f::$($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"
              $bad++
            } else {
              Write-Host "OK $f"
            }
          }
          if ($bad) { exit 1 }
      # 图标工厂 / 主题读取 / 菜单渲染的单元测试（轻提示窗测试需要交互桌面，不放在 CI）
      - name: Helper type tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-icon-factory.ps1
          ./scripts/test-theme-icon.ps1
          ./scripts/test-menu-renderer.ps1
          ./scripts/test-dsh-resolve.ps1
